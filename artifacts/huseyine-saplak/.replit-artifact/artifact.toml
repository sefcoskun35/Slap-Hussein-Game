kind = "web"
previewPath = "/"
title = "Hüseyin'e Şaplak"
version = "1.0.0"
id = "artifacts/huseyine-saplak"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24236

[services.development]
run = "pnpm --filter @workspace/huseyine-saplak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/huseyine-saplak", "run", "build" ]
publicDir = "artifacts/huseyine-saplak/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24236"
BASE_PATH = "/"
